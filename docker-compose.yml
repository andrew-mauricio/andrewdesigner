services:
  andrewdesigner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andrewdesigner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8080"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/q/health/live >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - andrewdesigner_net
    deploy:
      resources:
        limits:
          memory: 320M

networks:
  andrewdesigner_net:
    name: andrewdesigner_net
